<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6fa" />
    <title>报工管理</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css?v=2.7" />
  </head>
  <body>
    <div class="app" id="app" hidden></div>

    <div class="login-wrap" id="login" hidden>
      <form class="login-card" id="loginForm">
        <div class="brand-mark" id="loginMark"></div>
        <h1>报工管理</h1>
        <p>请输入访问密码</p>
        <input
          class="input"
          id="loginPassword"
          type="password"
          placeholder="密码"
          autocomplete="current-password"
        />
        <button class="btn btn-primary btn-block" type="submit" id="loginBtn">进入系统</button>
        <div class="login-err" id="loginErr"></div>
      </form>
    </div>

    <div class="toast-wrap" id="toastWrap"></div>
    <div id="modalRoot"></div>

    <script src="js/core/util.js?v=2.7" defer></script>
    <script src="js/core/range.js?v=2.7" defer></script>
    <script src="js/features/pdf.js?v=2.7" defer></script>
    <script src="js/core/store.js?v=2.7" defer></script>
    <script src="js/core/icons.js?v=2.7" defer></script>
    <script src="js/core/model.js?v=2.7" defer></script>
    <script src="js/core/api.js?v=2.7" defer></script>
    <script src="js/shell/layout.js?v=2.7" defer></script>
    <script src="js/shell/router.js?v=2.7" defer></script>
    <script src="js/ui/components.js?v=2.7" defer></script>
    <script src="js/features/csv.js?v=2.7" defer></script>
    <script src="js/features/image.js?v=2.7" defer></script>
    <script src="app.js?v=2.7" defer></script>
  </body>
</html>
