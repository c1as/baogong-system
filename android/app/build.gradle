plugins {
    id 'com.android.application'
}

// release 签名：优先读环境变量（适合 CI），其次读工程根目录的 keystore.properties。
// keystore.properties 与 *.jks 都已在 .gitignore 中排除，绝不入库。
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// WireGuard tunnel 库版本，升级时只改这里
def wireguardTunnelVersion = '1.0.20230706'

android {
    namespace 'com.baogong.helper'
    compileSdk 35

    defaultConfig {
        applicationId 'com.baogong.helper'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '3.0'

        // V4 EasyTier：目前仅编译了 arm64-v8a 的 native 库，
        // 限制打包架构，避免其他 ABI 因缺少 .so 而在运行时失败。
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            def store = System.getenv('BG_KEYSTORE') ?: keystoreProperties.getProperty('storeFile')
            def storePass = System.getenv('BG_STORE_PASS') ?: keystoreProperties.getProperty('storePassword')
            def alias = System.getenv('BG_KEY_ALIAS') ?: keystoreProperties.getProperty('keyAlias')
            def keyPass = System.getenv('BG_KEY_PASS') ?: keystoreProperties.getProperty('keyPassword')
            // 四项齐全才算配好签名；缺任意一项时不设置，release 会退回未签名产物而不至于构建失败
            if (store && storePass && alias && keyPass) {
                // 相对路径按工程根目录解析（本文件在 app/ 下）
                storeFile rootProject.file(store)
                storePassword storePass
                keyAlias alias
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            // 有真实 keystore 才启用签名，保证 assembleRelease 在任何环境都能跑通
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // WireGuard tunnel 库使用了 Java 8 API，需要脱糖才能在 minSdk 24 上运行
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation "com.wireguard.android:tunnel:${wireguardTunnelVersion}"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
}
